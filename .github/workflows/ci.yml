name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: End-to-end evaluation on a fresh synthetic set
        run: |
          python -m taxdoc generate --out data --n 120
          python -m taxdoc evaluate --data data --out out
